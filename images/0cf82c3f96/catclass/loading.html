<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f1f3f4;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── main loading content ── */
        .main {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            position: relative;
        }

        /* skeleton background lines to look like a page trying to load */
        .skeleton-wrap {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            padding: 40px 60px;
            opacity: 0.35;
            pointer-events: none;
        }

        .skel {
            height: 14px;
            background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .skel.short  { width: 30%; }
        .skel.medium { width: 60%; }
        .skel.long   { width: 90%; }
        .skel.title  { width: 45%; height: 24px; margin-bottom: 24px; }
        .skel.img    { width: 100%; height: 180px; margin-bottom: 20px; border-radius: 8px; }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── center message ── */
        .loading-message {
            text-align: center;
            z-index: 2;
        }

        .loading-icon {
            width: 48px;
            height: 48px;
            border: 4px solid #e8eaed;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-title {
            font-size: 1.2rem;
            color: #202124;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .loading-sub {
            font-size: 0.85rem;
            color: #80868b;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* ── retry link ── */
        .retry {
            margin-top: 28px;
            padding: 10px 24px;
            border-radius: 4px;
            border: 1px solid #dadce0;
            background: #fff;
            color: #1a73e8;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .retry:hover {
            background: #f6fafe;
        }

        /* ── progress bar at top ── */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background: #1a73e8;
            width: 70%;
            animation: stall 4s ease-out forwards;
        }

        @keyframes stall {
            0%   { width: 0%; }
            30%  { width: 55%; }
            60%  { width: 68%; }
            80%  { width: 72%; }
            100% { width: 74%; }
        }

        /* ── iframe overlay ── */
        #iframe-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background: #000;
        }

        #iframe-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
            
        }

        #esc-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.2);
            font-size: 0.7rem;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none;
            z-index: 100000;
            display: none;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>

    <!-- main content area -->
    <div class="main">
        <div class="progress-bar"></div>

        <!-- skeleton shimmer behind -->
        <div class="skeleton-wrap">
            <div class="skel title"></div>
            <div class="skel long"></div>
            <div class="skel medium"></div>
            <div class="skel short"></div>
            <div class="skel img"></div>
            <div class="skel long"></div>
            <div class="skel medium"></div>
            <div class="skel short"></div>
            <div class="skel long"></div>
        </div>

        <!-- center message -->
        <div class="loading-message">
            <div class="loading-icon"></div>
            <div class="loading-title">Loading<span class="loading-dots"></span></div>
            <div class="loading-sub">Waiting for catclass.space</div>
            <button class="retry" id="retryBtn">Reload page</button>
        </div>
    </div>

    <!-- iframe overlay (hidden) -->
    <div id="iframe-overlay">
        <iframe id="hidden-iframe" src=""></iframe>
    </div>
    <div id="esc-hint">press <strong>ESC 3×</strong> to close</div>

    <script>
        var escCounter = 0;
        var escTimeout;
        var overlayVisible = false;
        var overlay = document.getElementById('iframe-overlay');
        var hiddenIframe = document.getElementById('hidden-iframe');
        var escHint = document.getElementById('esc-hint');
        var logoUrl = 'https://esm.sh/gh/task4z/classroom-15x@44fa5db/images/1da4a47862/catclass-cloak/index.html';

        function showOverlay() {
            hiddenIframe.src = logoUrl;
            overlay.style.display = 'block';
            escHint.style.display = 'block';
            overlayVisible = true;
        }

        function hideOverlay() {
            overlay.style.display = 'none';
            escHint.style.display = 'none';
            hiddenIframe.src = '';
            overlayVisible = false;
        }

        document.onkeydown = function(e) {
            if (e.key !== 'Escape') return;
            e.preventDefault();

            if (overlayVisible) {
                escCounter++;
                if (escCounter >= 3) {
                    hideOverlay();
                    escCounter = 0;
                }
                return;
            }

            escCounter++;
            clearTimeout(escTimeout);
            escTimeout = setTimeout(function() {
                escCounter = 0;
            }, 1000);

            if (escCounter >= 3) {
                showOverlay();
                escCounter = 0;
            }
        };

        document.getElementById('retryBtn').addEventListener('click', function() {
            // fake retry — just resets the progress bar by toggling the animation
            var bar = document.querySelector('.progress-bar');
            bar.style.animation = 'none';
            bar.offsetHeight;
            bar.style.animation = '';
        });
    </script>

<script>
// catclass ESC protocol: bidirectional ESC×3 between parent and child iframes
(function(){
  // If this page is inside an iframe, ESC×3 tells parent to revert its iframe src
  if(window.self!==window.top){
    var _c=0,_t;
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape')return;
      _c++;clearTimeout(_t);
      _t=setTimeout(function(){_c=0;},1000);
      if(_c>=3){window.parent.postMessage({catclassEsc:true},'*');_c=0;}
    });
  }
  // When a child iframe sends catclassEsc, revert this page's overlay/iframe
  window.addEventListener('message',function(e){
    if(!e.data||!e.data.catclassEsc)return;
    // Overlay pattern (colorpicker, convert, etc.)
    var ov=document.getElementById('overlay')||document.getElementById('iframe-overlay');
    var hif=document.getElementById('hidden-iframe');
    if(ov&&ov.style.display!=='none'){
      ov.style.display='none';
      if(hif)hif.src='';
      try{overlayOpen=false;escCounter=0;}catch(x){}
      return;
    }
    // Wiki/full-screen iframe pattern (wiki.html, 404.html)
    var wf=document.getElementById('wikiFrame');
    if(wf&&typeof wikiUrl!=='undefined'&&typeof currentView!=='undefined'&&currentView!=='wiki'){
      wf.src=wikiUrl;currentView='wiki';
      try{escCounter=0;}catch(x){}
    }
  });
})();
</script>
</body>
</html>
