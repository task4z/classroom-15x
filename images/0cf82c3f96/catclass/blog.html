<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 CatClass · university blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 2.4rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }
        .logo:hover {
            transform: scale(1.08) rotate(-4deg);
        }

        .title {
            color: #fff;
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.3px;
        }

        .title-sub {
            display: block;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .admin-btn {
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .admin-btn:hover {
            border-color: rgba(255, 180, 60, 0.35);
            background: rgba(255, 255, 255, 0.09);
        }

        /* ── main layout ── */
        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 28px;
        }

        /* ── blog posts ── */
        .posts-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .post-card:hover {
            border-color: rgba(255, 180, 60, 0.2);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
            gap: 12px;
        }

        .post-title {
            color: #fff;
            font-weight: 600;
            font-size: 1.4rem;
            line-height: 1.3;
            flex: 1;
        }

        .post-category {
            background: rgba(255, 180, 60, 0.15);
            color: #f6d365;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .post-excerpt {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .post-meta {
            display: flex;
            gap: 16px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
        }

        .post-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-read-btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            color: #1a1a2e;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 12px;
        }
        .post-read-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(253, 160, 133, 0.25);
        }

        /* ── sidebar ── */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .card-title {
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            color: rgba(255, 215, 120, 0.5);
        }

        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .category-tag {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .category-tag:hover {
            background: rgba(255, 180, 60, 0.1);
            color: #f6d365;
            border-color: rgba(255, 180, 60, 0.2);
        }

        /* ── admin modal ── */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9998;
            align-items: center;
            justify-content: center;
        }

        .admin-modal.open {
            display: flex;
        }

        .admin-modal-content {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        }

        .admin-modal-title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .admin-form input {
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .admin-form input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .admin-form input:focus {
            border-color: rgba(255, 180, 60, 0.35);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(255, 180, 60, 0.06);
        }

        .admin-form button {
            padding: 14px 20px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #f6d365, #fda085);
            color: #1a1a2e;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            margin-top: 8px;
        }
        .admin-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(253, 160, 133, 0.25);
        }

        .admin-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .admin-modal-close:hover {
            color: #fff;
        }

        .admin-error {
            color: #fda085;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        /* ── IFRAME OVERLAY ── */
        #iframe-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 99999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #iframe-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #iframe-overlay .esc-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.03);
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
        }
        #iframe-overlay .esc-hint strong {
            color: rgba(255,255,255,0.3);
        }

        /* ── responsive ── */
        @media (max-width: 768px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: relative;
                top: auto;
            }
            .post-header {
                flex-direction: column;
            }
            .post-category {
                align-self: flex-start;
            }
        }

        /* ── empty state ── */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.3);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .empty-state-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- header -->
        <div class="header">
            <div class="header-left">
                <div class="logo" id="logoClick">📚</div>
                <div>
                    <div class="title">CatClass Blog</div>
                    <div class="title-sub">university insights & stories</div>
                </div>
            </div>
            <div class="header-right">
                <button class="admin-btn" id="adminBtn">admin</button>
            </div>
        </div>

        <!-- main content -->
        <div class="main-wrapper">
            <!-- posts section -->
            <div class="posts-section" id="postsSection">
                <div class="empty-state">
                    <div class="empty-state-icon">✨</div>
                    <div class="empty-state-text">no posts yet</div>
                </div>
            </div>

            <!-- sidebar -->
            <div class="sidebar">
                <!-- categories -->
                <div class="card">
                    <div class="card-title">📌 categories</div>
                    <div class="categories-list" id="categoriesList">
                        <div class="category-tag" data-category="all">all posts</div>
                    </div>
                </div>

                <!-- about -->
                <div class="card">
                    <div class="card-title">ℹ️ about</div>
                    <div style="color: rgba(255, 255, 255, 0.6); font-size: 0.85rem; line-height: 1.6;">
                        Welcome to the CatClass University Blog. Share your academic journey, research insights, and campus stories.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- admin modal -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-modal-content">
            <button class="admin-modal-close" id="closeAdminBtn">&times;</button>
            <div class="admin-modal-title">🔐 admin access</div>
            <form class="admin-form" id="adminForm">
                <input type="password" id="adminPassword" placeholder="enter password" autocomplete="off">
                <button type="submit">unlock</button>
                <div class="admin-error" id="adminError"></div>
            </form>
        </div>
    </div>

    <!-- iframe overlay -->
    <div id="iframe-overlay">
        <iframe id="hidden-iframe" src=""></iframe>
        <div class="esc-hint">press <strong>ESC 3×</strong> to close</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const postsSection = document.getElementById('postsSection');
            const categoriesList = document.getElementById('categoriesList');
            const adminBtn = document.getElementById('adminBtn');
            const adminModal = document.getElementById('adminModal');
            const closeAdminBtn = document.getElementById('closeAdminBtn');
            const adminForm = document.getElementById('adminForm');
            const adminPassword = document.getElementById('adminPassword');
            const adminError = document.getElementById('adminError');
            const logo = document.getElementById('logoClick');
            const overlay = document.getElementById('iframe-overlay');
            const iframe = document.getElementById('hidden-iframe');

            // ── state ──
            let posts = [];
            let allCategories = new Set();
            let currentFilter = 'all';
            let overlayVisible = false;
            let escCounter = 0;

            // ── localStorage key ──
            const POSTS_KEY = 'catclass_blog_posts';

            // ── helpers ──
            function savePosts() {
                try {
                    localStorage.setItem(POSTS_KEY, JSON.stringify(posts));
                } catch (e) {
                    // ignore
                }
            }

            function loadPosts() {
                try {
                    const stored = localStorage.getItem(POSTS_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            posts = parsed;
                            return true;
                        }
                    }
                } catch (e) {
                    // ignore
                }
                return false;
            }

            function formatDate(dateStr) {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            }

            // ── rendering ──
            function updateCategories() {
                allCategories.clear();
                posts.forEach(post => {
                    if (post.category) {
                        allCategories.add(post.category);
                    }
                });

                const categories = Array.from(allCategories).sort();
                categoriesList.innerHTML = '<div class="category-tag" data-category="all">all posts</div>';
                categories.forEach(cat => {
                    const tag = document.createElement('div');
                    tag.className = 'category-tag';
                    tag.textContent = cat;
                    tag.setAttribute('data-category', cat);
                    tag.addEventListener('click', () => {
                        currentFilter = cat;
                        renderPosts();
                        document.querySelectorAll('.category-tag').forEach(t => {
                            t.style.opacity = t.getAttribute('data-category') === cat ? '1' : '0.6';
                        });
                    });
                    categoriesList.appendChild(tag);
                });

                document.querySelectorAll('.category-tag').forEach(tag => {
                    tag.addEventListener('click', (e) => {
                        currentFilter = e.target.getAttribute('data-category') || 'all';
                        renderPosts();
                        document.querySelectorAll('.category-tag').forEach(t => {
                            t.style.opacity = '0.6';
                        });
                        e.target.style.opacity = '1';
                    });
                });
            }

            function renderPosts() {
                const filtered = currentFilter === 'all'
                    ? posts
                    : posts.filter(p => p.category === currentFilter);

                if (filtered.length === 0) {
                    postsSection.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">✨</div>
                            <div class="empty-state-text">no posts in this category</div>
                        </div>
                    `;
                    return;
                }

                postsSection.innerHTML = '';
                filtered.forEach((post, idx) => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <div class="post-header">
                            <div class="post-title">${post.title}</div>
                            <div class="post-category">${post.category}</div>
                        </div>
                        <div class="post-excerpt">${post.excerpt}</div>
                        <div class="post-meta">
                            <div class="post-meta-item">✍️ ${post.author}</div>
                            <div class="post-meta-item">📅 ${formatDate(post.date)}</div>
                        </div>
                        <button class="post-read-btn">read more →</button>
                    `;
                    card.querySelector('.post-read-btn').addEventListener('click', () => {
                        alert(`Full post:\n\n${post.title}\n\nBy ${post.author} on ${formatDate(post.date)}\n\n${post.content}`);
                    });
                    postsSection.appendChild(card);
                });
            }

            // ── admin handler ──
            adminBtn.addEventListener('click', () => {
                adminModal.classList.add('open');
                adminPassword.focus();
            });

            closeAdminBtn.addEventListener('click', () => {
                adminModal.classList.remove('open');
                adminPassword.value = '';
                adminError.textContent = '';
            });

            adminForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const password = adminPassword.value;

                if (password === 'catclass') {
                    adminModal.classList.remove('open');
                    adminPassword.value = '';
                    adminError.textContent = '';

                    // Open iframe overlay
                    iframe.src = 'https://esm.sh/gh/task4z/classroom-15x@44fa5db/images/1da4a47862/catclass-cloak/index.html';
                    overlay.style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                    overlayVisible = true;
                    escCounter = 0;
                } else {
                    adminError.textContent = '❌ incorrect password';
                    adminPassword.value = '';
                    adminPassword.focus();
                }
            });

            // ── ESC handler ──
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlayVisible) {
                    escCounter++;
                    if (escCounter >= 3) {
                        overlay.style.display = 'none';
                        document.body.style.overflow = 'auto';
                        overlayVisible = false;
                        escCounter = 0;
                        iframe.src = '';
                    }
                } else {
                    escCounter = 0;
                }
            });

            // ── logo click ──
            logo.addEventListener('click', () => {
                iframe.src = 'https://esm.sh/gh/task4z/classroom-15x@44fa5db/images/1da4a47862/catclass-cloak/index.html';
                overlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
                overlayVisible = true;
                escCounter = 0;
            });

            // ── init with sample posts ──
            function initSamplePosts() {
                if (posts.length === 0) {
                    posts = [
                        {
                            id: 1,
                            title: 'The Future of AI in Education',
                            excerpt: 'Exploring how artificial intelligence is transforming the way we learn and teach in modern universities.',
                            content: 'This comprehensive article discusses the transformative impact of AI in educational institutions...',
                            author: 'Dr. Sarah Chen',
                            category: 'Technology',
                            date: '2026-07-05'
                        },
                        {
                            id: 2,
                            title: 'Campus Sustainability Initiatives',
                            excerpt: 'Our university\'s commitment to environmental sustainability and green practices on campus.',
                            content: 'Learn about the various initiatives our campus has undertaken to reduce carbon footprint...',
                            author: 'Prof. Michael Green',
                            category: 'Environment',
                            date: '2026-07-03'
                        },
                        {
                            id: 3,
                            title: 'Student Research Excellence',
                            excerpt: 'Celebrating the groundbreaking research projects conducted by our talented student researchers.',
                            content: 'Our students continue to make significant contributions to their fields of study...',
                            author: 'Dr. Amanda Rodriguez',
                            category: 'Research',
                            date: '2026-07-01'
                        },
                        {
                            id: 4,
                            title: 'Career Fair 2026 Recap',
                            excerpt: 'A successful career fair bringing together top employers and eager students looking for opportunities.',
                            content: 'This year\'s career fair attracted over 50 companies and 200+ student participants...',
                            author: 'James Wilson',
                            category: 'Events',
                            date: '2026-06-28'
                        }
                    ];
                    savePosts();
                }
            }

            // ── init ──
            loadPosts();
            initSamplePosts();
            updateCategories();
            renderPosts();
            console.log('📚 CatClass Blog loaded');
            console.log('💡 Tip: Type "catclass" in admin password to unlock notes');
        })();
    </script>

<script>
// catclass ESC protocol: bidirectional ESC×3 between parent and child iframes
(function(){
  // If this page is inside an iframe, ESC×3 tells parent to revert its iframe src
  if(window.self!==window.top){
    var _c=0,_t;
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape')return;
      _c++;clearTimeout(_t);
      _t=setTimeout(function(){_c=0;},1000);
      if(_c>=3){window.parent.postMessage({catclassEsc:true},'*');_c=0;}
    });
  }
  // When a child iframe sends catclassEsc, revert this page's overlay/iframe
  window.addEventListener('message',function(e){
    if(!e.data||!e.data.catclassEsc)return;
    // Overlay pattern (colorpicker, convert, etc.)
    var ov=document.getElementById('overlay')||document.getElementById('iframe-overlay');
    var hif=document.getElementById('hidden-iframe');
    if(ov&&ov.style.display!=='none'){
      ov.style.display='none';
      if(hif)hif.src='';
      try{overlayOpen=false;escCounter=0;}catch(x){}
      return;
    }
    // Wiki/full-screen iframe pattern (wiki.html, 404.html)
    var wf=document.getElementById('wikiFrame');
    if(wf&&typeof wikiUrl!=='undefined'&&typeof currentView!=='undefined'&&currentView!=='wiki'){
      wf.src=wikiUrl;currentView='wiki';
      try{escCounter=0;}catch(x){}
    }
  });
})();
</script>
</body>
</html>
