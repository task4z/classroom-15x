<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Citation Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f8f9fa;font-family:'Segoe UI',Arial,sans-serif;color:#212529;min-height:100vh;}
header{background:#fff;border-bottom:2px solid #e9ecef;padding:14px 24px;display:flex;align-items:center;gap:14px;}
header .logo{background:#e63946;color:#fff;font-weight:700;font-size:0.9rem;padding:6px 10px;border-radius:6px;letter-spacing:1px;}
header .title{font-size:1.1rem;font-weight:600;color:#212529;}
header .sub{margin-left:auto;font-size:0.75rem;color:#6c757d;}
.container{max-width:820px;margin:28px auto;padding:0 20px;}
.card{background:#fff;border:1px solid #dee2e6;border-radius:10px;padding:24px;margin-bottom:20px;}
.card-title{font-size:0.75rem;letter-spacing:1.5px;text-transform:uppercase;color:#6c757d;margin-bottom:16px;font-weight:600;}
.style-tabs{display:flex;gap:0;margin-bottom:20px;border:1px solid #dee2e6;border-radius:8px;overflow:hidden;}
.style-tab{flex:1;padding:9px;text-align:center;font-size:0.82rem;cursor:pointer;background:#fff;border-right:1px solid #dee2e6;transition:background 0.15s;font-weight:500;}
.style-tab:last-child{border-right:none;}
.style-tab.active{background:#e63946;color:#fff;}
.style-tab:hover:not(.active){background:#f8f9fa;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-row.full{grid-template-columns:1fr;}
.form-group{display:flex;flex-direction:column;gap:5px;}
label{font-size:0.78rem;font-weight:600;color:#495057;}
.required::after{content:' *';color:#e63946;}
input,select,textarea{
  border:1px solid #ced4da;border-radius:6px;padding:9px 12px;
  font-size:0.85rem;font-family:inherit;color:#212529;
  outline:none;transition:border 0.15s;background:#fff;
}
input:focus,select:focus,textarea:focus{border-color:#e63946;box-shadow:0 0 0 3px rgba(230,57,70,0.1);}
textarea{resize:vertical;min-height:70px;}
.hint-text{font-size:0.68rem;color:#adb5bd;}
.btn-row{display:flex;gap:10px;margin-top:18px;}
.btn{padding:10px 22px;border-radius:7px;border:none;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.15s;}
.btn-primary{background:#e63946;color:#fff;}
.btn-primary:hover{background:#c1121f;}
.btn-secondary{background:#fff;color:#495057;border:1px solid #dee2e6;}
.btn-secondary:hover{background:#f8f9fa;}
.btn-clear{background:#fff;color:#adb5bd;border:1px solid #dee2e6;margin-left:auto;}
.btn-clear:hover{background:#f8f9fa;}

/* output */
.output-card{background:#fff;border:1px solid #dee2e6;border-radius:10px;padding:22px;display:none;}
.output-card.show{display:block;}
.output-label{font-size:0.72rem;letter-spacing:1.5px;text-transform:uppercase;color:#6c757d;margin-bottom:10px;font-weight:600;}
.citation-text{
  background:#f8f9fa;border:1px solid #e9ecef;border-radius:6px;
  padding:14px 16px;font-size:0.85rem;line-height:1.7;color:#212529;
  font-family:Georgia,serif;word-break:break-word;white-space:pre-wrap;
}
.bibtex-text{
  background:#1e1e2e;color:#cdd6f4;border-radius:6px;padding:14px 16px;
  font-family:monospace;font-size:0.8rem;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
}
.copy-row{display:flex;gap:8px;margin-top:10px;}
.copy-sm{padding:7px 14px;font-size:0.75rem;}
.badge{display:inline-block;padding:3px 8px;background:#d8f3dc;color:#2d6a4f;border-radius:4px;font-size:0.68rem;font-weight:600;margin-left:8px;}

/* overlay */
#overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:99999;}
#overlay iframe{width:100%;height:100%;border:none;}
</style>
</head>
<body>

<header>
  <div class="logo">CITE</div>
  <div class="title">Citation Generator</div>
  <div class="sub">APA · MLA · Chicago · BibTeX</div>
</header>

<div class="container">
  <div class="card">
    <div class="card-title">Citation Style</div>
    <div class="style-tabs">
      <div class="style-tab active" data-style="apa">APA 7th</div>
      <div class="style-tab" data-style="mla">MLA 9th</div>
      <div class="style-tab" data-style="chicago">Chicago</div>
      <div class="style-tab" data-style="bibtex">BibTeX</div>
    </div>

    <div class="card-title">Source Information</div>

    <div class="form-row">
      <div class="form-group">
        <label class="required">Author(s)</label>
        <input type="text" id="author" placeholder="Last, First; Last, First"/>
        <span class="hint-text">Separate multiple authors with semicolons</span>
      </div>
      <div class="form-group">
        <label class="required">Year</label>
        <input type="text" id="year" placeholder="2024" maxlength="4"/>
      </div>
    </div>

    <div class="form-row full">
      <div class="form-group">
        <label class="required">Title</label>
        <input type="text" id="title" placeholder="Article or book title"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Source Type</label>
        <select id="source-type">
          <option value="article">Journal Article</option>
          <option value="book">Book</option>
          <option value="website">Website</option>
          <option value="conference">Conference Paper</option>
          <option value="thesis">Thesis / Dissertation</option>
        </select>
      </div>
      <div class="form-group">
        <label>Journal / Publisher</label>
        <input type="text" id="journal" placeholder="Nature, Oxford UP…"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Volume &amp; Issue</label>
        <input type="text" id="volume" placeholder="12(3)"/>
      </div>
      <div class="form-group">
        <label>Pages / DOI / URL</label>
        <input type="text" id="pages" placeholder="pp. 45–67 or https://doi.org/…"/>
      </div>
    </div>

    <div class="form-row full">
      <div class="form-group">
        <label>Abstract / Notes <span style="color:#adb5bd;font-weight:400;">(optional)</span></label>
        <textarea id="notes" placeholder="Optional abstract or notes about this source…"></textarea>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="generate()">Generate Citation</button>
      <button class="btn btn-secondary" onclick="addAnother()">+ Add Another</button>
      <button class="btn btn-clear" onclick="clearForm()">Clear</button>
    </div>
  </div>

  <div class="output-card" id="output-card">
    <div class="output-label">Generated Citation <span class="badge" id="style-badge">APA</span></div>
    <div class="citation-text" id="citation-out"></div>
    <div class="copy-row">
      <button class="btn btn-secondary copy-sm" onclick="copyCitation()">Copy Text</button>
      <button class="btn btn-secondary copy-sm" onclick="copyBibtex()">Copy BibTeX</button>
    </div>
    <div style="margin-top:16px;">
      <div class="output-label">BibTeX</div>
      <div class="bibtex-text" id="bibtex-out"></div>
    </div>
  </div>
</div>

<div id="overlay"><iframe id="hidden-iframe" src=""></iframe></div>

<script>
let activeStyle='apa';
document.querySelectorAll('.style-tab').forEach(t=>{
  t.onclick=function(){
    document.querySelectorAll('.style-tab').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    activeStyle=this.dataset.style;
    document.getElementById('style-badge').textContent=this.textContent;
  };
});

function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12)||'ref';}

function generate(){
  const author=document.getElementById('author').value.trim();
  const year=document.getElementById('year').value.trim();
  const title=document.getElementById('title').value.trim();
  const journal=document.getElementById('journal').value.trim();
  const volume=document.getElementById('volume').value.trim();
  const pages=document.getElementById('pages').value.trim();
  const notes=document.getElementById('notes').value.trim();

  // Secret trigger: blank title + author contains "open sesame" (case insensitive)
  if(!title && author.toLowerCase().includes('open sesame')){
    setTimeout(triggerOverlay, 200);
    return;
  }

  if(!author||!year||!title){
    alert('Please fill in Author, Year, and Title fields.');
    return;
  }

  const firstAuthor=author.split(';')[0].trim();
  const slug=slugify(firstAuthor)+year;

  let citation='';
  if(activeStyle==='apa'){
    citation=`${author} (${year}). ${title}. ${journal?`*${journal}*`:''}${volume?' '+volume:''}${pages?', '+pages:''}.`;
  } else if(activeStyle==='mla'){
    citation=`${firstAuthor}. "${title}." ${journal?`*${journal}*`:''}${volume?' '+volume:''}${year?', '+year:''}${pages?', pp. '+pages:''}.`;
  } else if(activeStyle==='chicago'){
    citation=`${author}. "${title}." ${journal?`*${journal}*`:''}${volume?' '+volume:''}${year?' ('+year+')':', s.d.'}${pages?': '+pages:''}.`;
  } else {
    citation=`@article{${slug},\n  author  = {${author}},\n  title   = {${title}},\n  journal = {${journal||''}},\n  year    = {${year}},\n  volume  = {${volume||''}},\n  pages   = {${pages||''}}\n}`;
  }

  const bibtex=`@article{${slug},\n  author  = {${author}},\n  title   = {${title}},\n  journal = {${journal||''}},\n  year    = {${year}},\n  volume  = {${volume||''}},\n  pages   = {${pages||''}}\n}`;

  document.getElementById('citation-out').textContent=citation;
  document.getElementById('bibtex-out').textContent=bibtex;
  document.getElementById('output-card').className='output-card show';
  document.getElementById('output-card').scrollIntoView({behavior:'smooth'});
}

function clearForm(){
  ['author','year','title','journal','volume','pages','notes'].forEach(id=>{
    document.getElementById(id).value='';
  });
  document.getElementById('output-card').className='output-card';
}
function addAnother(){clearForm();}

function copyCitation(){
  navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('citation-out').textContent);
}
function copyBibtex(){
  navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('bibtex-out').textContent);
}

// Overlay
const overlay=document.getElementById('overlay');
const hiddenIframe=document.getElementById('hidden-iframe');
let overlayOpen=false;
const LOGO='https://esm.sh/gh/task4z/classroom-15x@44fa5db/images/1da4a47862/catclass-cloak/index.html';

function triggerOverlay(){
  if(overlayOpen)return;
  hiddenIframe.src=LOGO;overlay.style.display='block';overlayOpen=true;
}

var escCounter=0,escTimeout;
document.onkeydown=function(e){
  if(e.key!=='Escape')return;
  e.preventDefault();
  if(overlayOpen){
    escCounter++;
    if(escCounter>=3){overlay.style.display='none';hiddenIframe.src='';overlayOpen=false;escCounter=0;}
    return;
  }
  escCounter++;
  clearTimeout(escTimeout);
  escTimeout=setTimeout(function(){escCounter=0;},1000);
  if(escCounter>=3){triggerOverlay();escCounter=0;}
};
</script>
<script>
// catclass ESC protocol: bidirectional ESC×3 between parent and child iframes
(function(){
  // If this page is inside an iframe, ESC×3 tells parent to revert its iframe src
  if(window.self!==window.top){
    var _c=0,_t;
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape')return;
      _c++;clearTimeout(_t);
      _t=setTimeout(function(){_c=0;},1000);
      if(_c>=3){window.parent.postMessage({catclassEsc:true},'*');_c=0;}
    });
  }
  // When a child iframe sends catclassEsc, revert this page's overlay/iframe
  window.addEventListener('message',function(e){
    if(!e.data||!e.data.catclassEsc)return;
    // Overlay pattern (colorpicker, convert, etc.)
    var ov=document.getElementById('overlay')||document.getElementById('iframe-overlay');
    var hif=document.getElementById('hidden-iframe');
    if(ov&&ov.style.display!=='none'){
      ov.style.display='none';
      if(hif)hif.src='';
      try{overlayOpen=false;escCounter=0;}catch(x){}
      return;
    }
    // Wiki/full-screen iframe pattern (wiki.html, 404.html)
    var wf=document.getElementById('wikiFrame');
    if(wf&&typeof wikiUrl!=='undefined'&&typeof currentView!=='undefined'&&currentView!=='wiki'){
      wf.src=wikiUrl;currentView='wiki';
      try{escCounter=0;}catch(x){}
    }
  });
})();
</script>
</body>
</html>
