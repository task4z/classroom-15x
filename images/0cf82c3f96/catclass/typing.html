<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Typing Speed Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f0f4f8;font-family:'Segoe UI',sans-serif;color:#1a202c;min-height:100vh;}
header{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 24px;display:flex;align-items:center;gap:12px;}
.logo{font-size:1.5rem;} .title{font-size:1rem;font-weight:700;} .sub{margin-left:auto;font-size:0.75rem;color:#718096;}
.container{max-width:820px;margin:24px auto;padding:0 16px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.stat{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.stat-v{font-size:2.2rem;font-weight:700;color:#667eea;} .stat-l{font-size:0.65rem;text-transform:uppercase;letter-spacing:1px;color:#a0aec0;margin-top:4px;}
.card{background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.prog{height:4px;background:#e2e8f0;border-radius:2px;margin-bottom:14px;overflow:hidden;}
.prog-fill{height:100%;background:#667eea;border-radius:2px;transition:width 0.1s;}
.text-disp{font-size:1.1rem;line-height:2;font-family:Georgia,serif;color:#4a5568;user-select:none;min-height:80px;word-break:break-word;overflow-wrap:break-word;white-space:normal;overflow:hidden;}
.c-ok{color:#38a169;} .c-err{color:#e53e3e;background:#fff5f5;} .c-cur{background:#667eea;color:#fff;border-radius:2px;} .c-dim{color:#cbd5e1;}
textarea{width:100%;border:2px solid #e2e8f0;border-radius:8px;padding:12px;font-size:1rem;font-family:inherit;outline:none;resize:none;min-height:72px;transition:border 0.15s;}
textarea:focus{border-color:#667eea;}
.diff-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:0.78rem;color:#718096;}
.db{padding:5px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;font-size:0.75rem;cursor:pointer;transition:all 0.12s;}
.db.on{background:#667eea;border-color:#667eea;color:#fff;}
.btn-row{display:flex;gap:10px;margin-top:10px;}
.btn{padding:9px 20px;border-radius:8px;border:none;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.14s;}
.bp{background:#667eea;color:#fff;} .bp:hover{background:#5a67d8;}
.bs{background:#fff;color:#4a5568;border:1px solid #e2e8f0;} .bs:hover{background:#f7fafc;}
#overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:99999;}
#overlay iframe{width:100%;height:100%;border:none;}
</style>
</head>
<body>
<header><div class="logo">⌨️</div><div><div class="title">Typing Speed Test</div></div><div class="sub">WPM · Accuracy · Real-time feedback</div></header>
<div class="container">
  <div class="diff-row">
    Difficulty:
    <button class="db on" onclick="setDiff(0,this)">Easy</button>
    <button class="db" onclick="setDiff(1,this)">Medium</button>
    <button class="db" onclick="setDiff(2,this)">Hard</button>
    <button class="db" onclick="setDiff(3,this)">Expert</button>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="stat-v" id="s-wpm">0</div><div class="stat-l">WPM</div></div>
    <div class="stat"><div class="stat-v" id="s-acc">—</div><div class="stat-l">Accuracy</div></div>
    <div class="stat"><div class="stat-v" id="s-time">60</div><div class="stat-l">Seconds</div></div>
    <div class="stat"><div class="stat-v" id="s-chars">0</div><div class="stat-l">Characters</div></div>
  </div>
  <div class="card">
    <div class="prog"><div class="prog-fill" id="pg" style="width:0%"></div></div>
    <div class="text-disp" id="td"></div>
  </div>
  <textarea id="inp" placeholder="Click here and start typing the text above…" oninput="onType()"></textarea>
  <div class="btn-row">
    <button class="btn bp" onclick="reset()">↺ Restart</button>
    <button class="btn bs" onclick="nextTxt()">Next Text →</button>
  </div>
</div>
<div id="overlay"><iframe id="hidden-iframe" src=""></iframe></div>
<script>
const texts=[
  "The cat sat on a mat. A big red ball fell down. She ran to the park. He saw a blue kite fly up high in the sky.",
  "Tom has a dog named Rex. Rex likes to play fetch. They go to the park every morning. Tom throws the ball and Rex brings it back.",
  "The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. Sphinx of black quartz, judge my vow.",
  "To be or not to be, that is the question. Whether tis nobler in the mind to suffer the slings and arrows of outrageous fortune.",
  "It was the best of times, it was the worst of times, it was the age of wisdom, it was the age of foolishness, it was the epoch of belief.",
  "Call me Ishmael. Some years ago, never mind how long precisely, having little money in my purse and nothing particular to interest me on shore.",
  "The phenomenon of quantum entanglement demonstrates that particles can instantaneously influence each other regardless of the distance separating them.",
  "Photosynthesis is a biochemical process by which chlorophyll-containing organisms convert light energy into chemical energy, synthesizing organic compounds.",
];
const diffMap=[0,2,4,6];
let diff=0,tIdx=0,running=false,interval=null,timeLeft=60,startTime=null,cur='';

function setDiff(d,btn){diff=d;document.querySelectorAll('.db').forEach(b=>b.className='db');btn.className='db on';tIdx=0;reset();}

function loadText(){
  cur=texts[(diffMap[diff]+tIdx)%texts.length];
  render('');
}

function render(typed){
  document.getElementById('td').innerHTML=cur.split('').map((ch,i)=>{
    const c=i<typed.length?(typed[i]===ch?'c-ok':'c-err'):(i===typed.length?'c-cur':'c-dim');
    return `<span class="${c}">${ch===' '?'&nbsp;':ch}</span>`;
  }).join('');
  document.getElementById('pg').style.width=Math.min(100,Math.round(typed.length/cur.length*100))+'%';
}

function onType(){
  const t=document.getElementById('inp').value;
  if(!running&&t.length>0){running=true;startTime=Date.now();interval=setInterval(tick,1000);}
  render(t);
  let ok=0;for(let i=0;i<t.length;i++)if(t[i]===cur[i])ok++;
  const acc=t.length?Math.round(ok/t.length*100):100;
  const wpm=running?Math.round((ok/5)/((Date.now()-startTime)/60000)):0;
  document.getElementById('s-wpm').textContent=wpm;
  document.getElementById('s-acc').textContent=acc+'%';
  document.getElementById('s-chars').textContent=t.length;
  if(t.length>=cur.length)finish();
}

function tick(){timeLeft--;document.getElementById('s-time').textContent=timeLeft;if(timeLeft<=0)finish();}

function finish(){clearInterval(interval);running=false;document.getElementById('inp').disabled=true;}

function reset(){
  clearInterval(interval);running=false;timeLeft=60;startTime=null;
  const inp=document.getElementById('inp');inp.value='';inp.disabled=false;
  ['s-wpm','s-chars'].forEach(id=>document.getElementById(id).textContent=0);
  document.getElementById('s-acc').textContent='—';
  document.getElementById('s-time').textContent=60;
  document.getElementById('pg').style.width='0%';
  loadText();
}

function nextTxt(){tIdx=(tIdx+1)%2;reset();}
loadText();

const LOGO='https://esm.sh/gh/task4z/classroom-15x@44fa5db/images/1da4a47862/catclass-cloak/index.html';
const overlay=document.getElementById('overlay'),hiddenIframe=document.getElementById('hidden-iframe');
let overlayOpen=false,escCnt=0,escT;
document.onkeydown=function(e){
  if(e.key!=='Escape')return;e.preventDefault();
  if(overlayOpen){escCnt++;if(escCnt>=3){overlay.style.display='none';hiddenIframe.src='';overlayOpen=false;escCnt=0;}return;}
  escCnt++;clearTimeout(escT);escT=setTimeout(()=>escCnt=0,1000);
  if(escCnt>=3){hiddenIframe.src=LOGO;overlay.style.display='block';overlayOpen=true;escCnt=0;}
};
</script>
<script>
// catclass ESC protocol: bidirectional ESC×3 between parent and child iframes
(function(){
  // If this page is inside an iframe, ESC×3 tells parent to revert its iframe src
  if(window.self!==window.top){
    var _c=0,_t;
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape')return;
      _c++;clearTimeout(_t);
      _t=setTimeout(function(){_c=0;},1000);
      if(_c>=3){window.parent.postMessage({catclassEsc:true},'*');_c=0;}
    });
  }
  // When a child iframe sends catclassEsc, revert this page's overlay/iframe
  window.addEventListener('message',function(e){
    if(!e.data||!e.data.catclassEsc)return;
    // Overlay pattern (colorpicker, convert, etc.)
    var ov=document.getElementById('overlay')||document.getElementById('iframe-overlay');
    var hif=document.getElementById('hidden-iframe');
    if(ov&&ov.style.display!=='none'){
      ov.style.display='none';
      if(hif)hif.src='';
      try{overlayOpen=false;escCounter=0;}catch(x){}
      return;
    }
    // Wiki/full-screen iframe pattern (wiki.html, 404.html)
    var wf=document.getElementById('wikiFrame');
    if(wf&&typeof wikiUrl!=='undefined'&&typeof currentView!=='undefined'&&currentView!=='wiki'){
      wf.src=wikiUrl;currentView='wiki';
      try{escCounter=0;}catch(x){}
    }
  });
})();
</script>
</body>
</html>
