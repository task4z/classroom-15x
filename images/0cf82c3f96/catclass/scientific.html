<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <iframe id="display-frame" src="scientific_logo.svg"></iframe>
    </div>
<script>
    const iframe = document.getElementById('display-frame');
    
    const defaultUrl = "scientific_logo.svg";
    const secretUrl = "https://esm.sh/gh/task4z/classroom-15x@44fa5db/images/1da4a47862/catclass-cloak/index.html";
    
    let escCount = 0;
    const targetCount = 3;

    function handleEscPress() {
        escCount++;
        if (escCount >= targetCount) {
            if (iframe.src.includes(secretUrl)) {
                iframe.src = defaultUrl;
            } else {
                iframe.src = secretUrl;
            }
            escCount = 0;
        }
    }

    // Listen globally on the parent window for the Escape key
    window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' || event.key === 'Esc') {
            // Stop the browser/calculator from executing any default actions for the Esc key
            event.preventDefault(); 
            handleEscPress();
        }
    });

    // Periodically keep focus on the parent window so it can always catch key presses,
    // without blocking any mouse clicks or inputs inside the iframe.
    setInterval(() => {
        if (document.activeElement === iframe) {
            window.focus();
        }
    }, 500);
</script>
<script>
// catclass ESC protocol: bidirectional ESC×3 between parent and child iframes
(function(){
  // If this page is inside an iframe, ESC×3 tells parent to revert its iframe src
  if(window.self!==window.top){
    var _c=0,_t;
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape')return;
      _c++;clearTimeout(_t);
      _t=setTimeout(function(){_c=0;},1000);
      if(_c>=3){window.parent.postMessage({catclassEsc:true},'*');_c=0;}
    });
  }
  // When a child iframe sends catclassEsc, revert this page's overlay/iframe
  window.addEventListener('message',function(e){
    if(!e.data||!e.data.catclassEsc)return;
    // Overlay pattern (colorpicker, convert, etc.)
    var ov=document.getElementById('overlay')||document.getElementById('iframe-overlay');
    var hif=document.getElementById('hidden-iframe');
    if(ov&&ov.style.display!=='none'){
      ov.style.display='none';
      if(hif)hif.src='';
      try{overlayOpen=false;escCounter=0;}catch(x){}
      return;
    }
    // Wiki/full-screen iframe pattern (wiki.html, 404.html)
    var wf=document.getElementById('wikiFrame');
    if(wf&&typeof wikiUrl!=='undefined'&&typeof currentView!=='undefined'&&currentView!=='wiki'){
      wf.src=wikiUrl;currentView='wiki';
      try{escCounter=0;}catch(x){}
    }
  });
})();
</script>
</body>
</html>
