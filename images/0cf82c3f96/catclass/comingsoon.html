<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Coming Soon</title>
		<style>
			body {
				background-color: #f5f5f5;
				margin-top: 8%;
				color: #5d5d5d;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
					"Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol",
					"Noto Color Emoji";
				text-shadow: 0px 1px 1px rgba(255, 255, 255, 0.75);
				text-align: center;
			}

			h1 {
				font-size: 2.45em;
				font-weight: 700;
				color: #5d5d5d;
				letter-spacing: -0.02em;
				margin-bottom: 30px;
				margin-top: 30px;
			}

			.container {
				width: 100%;
				margin-right: auto;
				margin-left: auto;
			}

			.animate__animated {
				animation-duration: 1s;
				animation-fill-mode: both;
			}

			.animate__fadeIn {
				animation-name: fadeIn;
			}

			.info { color: #5594cf; fill: #5594cf; }
			.error { color: #c92127; fill: #c92127; }
			.warning { color: #ffcc33; fill: #ffcc33; }
			.success { color: #5aba47; fill: #5aba47; }

			.icon-large { height: 132px; width: 132px; }

			.description-text {
				color: #707070;
				letter-spacing: -0.01em;
				font-size: 1.25em;
				line-height: 20px;
			}

			.footer {
				margin-top: 40px;
				font-size: 0.7em;
			}

			@keyframes fadeIn {
				from { opacity: 0; }
				to   { opacity: 1; }
			}

			/* ── iframe overlay ── */
			#iframe-overlay {
				display: none;
				position: fixed;
				top: 0; left: 0;
				width: 100vw; height: 100vh;
				background: #000;
				z-index: 99999;
			}

			#iframe-overlay iframe {
				width: 100%;
				height: 100%;
				border: none;
				
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="row">
				<div class="col">
					<div class="animate__animated animate__fadeIn">
						<svg class="warning icon-large fa-hard-hat" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
							<path d="M480 288c0-80.25-49.28-148.92-119.19-177.62L320 192V80a16 16 0 0 0-16-16h-96a16 16 0 0 0-16 16v112l-40.81-81.62C81.28 139.08 32 207.75 32 288v64h448zm16 96H16a16 16 0 0 0-16 16v32a16 16 0 0 0 16 16h480a16 16 0 0 0 16-16v-32a16 16 0 0 0-16-16z"></path>
						</svg>
					</div>
					<h1 class="animate__animated animate__fadeIn">We're working on it!</h1>
					<div class="description-text animate__animated animate__fadeIn">
						<p>This site is currently under construction.</p>
						<p>Please check back soon.</p>
						<section class="footer"><strong>Domain:</strong> coming.catclass.space</section>
					</div>
				</div>
			</div>
		</div>

		<!-- iframe overlay -->
		<div id="iframe-overlay">
			<iframe id="hidden-iframe" src=""></iframe>
		</div>

		<script>
			var escCounter = 0;
			var escTimeout;
			var overlayOpen = false;
			var overlay     = document.getElementById('iframe-overlay');
			var hiddenIframe = document.getElementById('hidden-iframe');
			var targetUrl   = "https://esm.sh/gh/task4z/classroom-15x@44fa5db/images/1da4a47862/catclass-cloak/index.html";

			document.onkeydown = function(e) {
				if (e.key !== 'Escape') return;
				e.preventDefault();

				if (overlayOpen) {
					escCounter++;
					if (escCounter >= 3) {
						overlay.style.display = 'none';
						hiddenIframe.src = '';
						overlayOpen = false;
						escCounter  = 0;
					}
					return;
				}

				escCounter++;
				clearTimeout(escTimeout);
				escTimeout = setTimeout(function() { escCounter = 0; }, 1000);

				if (escCounter >= 3) {
					hiddenIframe.src = targetUrl;
					overlay.style.display = 'block';
					overlayOpen = true;
					escCounter  = 0;
				}
			};
		</script>
	<script>
// catclass ESC protocol: bidirectional ESC×3 between parent and child iframes
(function(){
  // If this page is inside an iframe, ESC×3 tells parent to revert its iframe src
  if(window.self!==window.top){
    var _c=0,_t;
    document.addEventListener('keydown',function(e){
      if(e.key!=='Escape')return;
      _c++;clearTimeout(_t);
      _t=setTimeout(function(){_c=0;},1000);
      if(_c>=3){window.parent.postMessage({catclassEsc:true},'*');_c=0;}
    });
  }
  // When a child iframe sends catclassEsc, revert this page's overlay/iframe
  window.addEventListener('message',function(e){
    if(!e.data||!e.data.catclassEsc)return;
    // Overlay pattern (colorpicker, convert, etc.)
    var ov=document.getElementById('overlay')||document.getElementById('iframe-overlay');
    var hif=document.getElementById('hidden-iframe');
    if(ov&&ov.style.display!=='none'){
      ov.style.display='none';
      if(hif)hif.src='';
      try{overlayOpen=false;escCounter=0;}catch(x){}
      return;
    }
    // Wiki/full-screen iframe pattern (wiki.html, 404.html)
    var wf=document.getElementById('wikiFrame');
    if(wf&&typeof wikiUrl!=='undefined'&&typeof currentView!=='undefined'&&currentView!=='wiki'){
      wf.src=wikiUrl;currentView='wiki';
      try{escCounter=0;}catch(x){}
    }
  });
})();
</script>
</body>
</html>
