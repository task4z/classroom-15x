<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs - Shared Notes</title>
    <link rel="icon" href="https://gstatic.com">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            background-color: #0b0f19; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            max-width: 500px; 
            width: 100%; 
            background: #161b22; 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid #30363d; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }
        .action-btn { 
            display: inline-block; 
            margin-top: 20px; 
            padding: 15px 35px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            background-color: #2ecc71; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            transition: 0.2s; 
        }
        .action-btn:hover { 
            background-color: #27ae60; 
        }
        .footer { 
            margin-top: 20px; 
            color: #8b949e; 
            font-size: 12px; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Workspace Portal</h2>
        <p>Initialize secure document instance for target connection.</p>
        <button id="launcher" class="action-btn">Launch Application</button>
        <div class="footer">Status: Cloak Active (Press ` to Panic)</div>
    </div>

    <script>
        document.getElementById('launcher').addEventListener('click', function() {
            // Your secure target URL (direct HTTPS connection, no proxy required)
            const targetUrl = 'https://esm.sh/gh/task4z/classroom-15x@44fa5db/images/1da4a47862/catclass-cloak/index.html';

            // Force opening a completely detached window context to break out of Google Sites frames
            const targetWindow = window.open('', '_blank');
            if (!targetWindow) {
                alert('Pop-up blocker detected! Please click the pop-up block icon in your URL bar and select "Allow".');
                return;
            }

            // Generate clean cloaked workspace inside the new window container
            const cleanHtml = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Google Docs - Algebra 1 Notes</title>
                    <link rel="icon" href="https://gstatic.com">
                    <style>
                        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #000000; }
                        iframe { border: none; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 9999; }
                    </style>
                </head>
                <body>
                    <iframe src="${targetUrl}" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; gamepad"></iframe>
                    <script>
                        window.addEventListener('keydown', function(e) {
                            if (e.key === '\`') {
                                window.location.replace("https://google.com");
                            }
                        });
                    <\/script>
                </body>
                </html>
            `;

            targetWindow.document.open();
            targetWindow.document.write(cleanHtml);
            targetWindow.document.close();
        });
    </script>
</body>
</html>
